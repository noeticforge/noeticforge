name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      - run: npm run build
      - run: npm run typecheck
      - run: npm run smoke
      - run: npm run test:unit
      - name: Build and publish desktop installers
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 禁用自动探测未配置的代码签名证书
          CSC_IDENTITY_AUTO_DISCOVERY: false

  publish-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Automatically Publish Release (Remove Draft & Set as Latest)
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const { owner, repo } = context.repo;
            const releases = await github.rest.repos.listReleases({ owner, repo, per_page: 20 });
            const rel = releases.data.find(r => r.tag_name === tag);
            if (rel) {
              await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: rel.id,
                draft: false,
                make_latest: 'true',
              });
              console.log(`🚀 Release ${tag} 已全自动解除 Draft，正式设置为 GitHub Latest 发布版！`);
            } else {
              console.log(`未找到与标签 ${tag} 匹配的 Release`);
            }
