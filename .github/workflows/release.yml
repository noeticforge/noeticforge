name: Release

# 触发语义(CHANGELOG [0.7.1] 设计,v0.7.4 如实落地):
#   - push v* tag:三平台矩阵各自「只构建不发布」(--publish never),产物上传统计后
#     由**单一** publish job 汇总成**一条**非草稿 Release——根治矩阵并发抢建同 tag
#     Release 的竞态(v0.5.8/v0.7.0 的产物曾被拆进两条 Release、latest*.yml 分散)。
#   - workflow_dispatch:只验证构建,不发布(publish job 被 tag 条件挡住)。
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      - run: npm run build
      - run: npm run typecheck
      - run: npm run smoke
      - run: npm run test:unit
      - run: npm run test:ipc
      - run: npm run check:codes
      - name: Build desktop installers (publish never — single publish job below)
        run: npx electron-builder --publish never
        env:
          # 禁用自动探测未配置的代码签名证书
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.zip
            release/*.yml
            release/*.blockmap
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: release
          merge-multiple: true
      - name: Generate release notes from CHANGELOG
        run: node scripts/release-notes.mjs RELEASE_NOTES.md
      - name: Publish single GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: false
          make_latest: 'true'
          fail_on_unmatched_files: true
          files: |
            release/*
