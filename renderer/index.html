<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Base 测试台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- 顶部 toast 容器：所有 ok:false 的错误提示都打在这里 -->
<div id="toast-box" aria-live="polite"></div>

<!-- 主布局：左侧边栏 + 右侧聊天区 -->
<div id="app">
  <aside id="sidebar">
    <!-- 插件管理面板 -->
    <section class="side-panel" id="plugin-panel">
      <h2 class="panel-title">🧩 插件管理</h2>
      <div id="plugin-list" class="plugin-list"></div>
      <div id="plugin-empty" class="empty-hint hidden">暂无插件</div>
      <div class="install-row">
        <input id="plugin-dir" type="text" placeholder="插件目录绝对路径，如 D:\plugins\my-plugin">
        <button id="install-btn">安装</button>
      </div>
    </section>
    <!-- 模型配置面板 -->
    <section class="side-panel" id="model-panel">
      <h2 class="panel-title">⚙️ 模型配置</h2>
      <label>Provider
        <select id="cfg-provider">
          <option value="deepseek">deepseek</option>
          <option value="openai">openai</option>
          <option value="anthropic">anthropic</option>
        </select>
      </label>
      <label>API Key <input id="cfg-apikey" type="password" placeholder="sk-...（留空则不修改）"></label>
      <label>Model <input id="cfg-model" type="text" placeholder="如 deepseek-chat"></label>
      <label>Base URL <input id="cfg-baseurl" type="text" placeholder="如 https://api.deepseek.com"></label>
      <button id="save-model-btn">保存配置</button>
    </section>
    <!-- 事件日志（可折叠） -->
    <section class="side-panel log-panel" id="log-panel">
      <h2 class="panel-title log-toggle" id="log-toggle">📋 事件日志 <span class="log-count" id="log-count">0</span><span class="log-arrow">▾</span></h2>
      <div id="log-body" class="log-body"><div id="log-list"></div></div>
    </section>
  </aside>

  <main id="chat-area">
    <header id="chat-header">
      <h1>Agent Base 测试台</h1>
      <span class="header-sub">渲染进程参考页 · 通过 window.agentBase 驱动底座</span>
    </header>
    <div id="messages" class="messages"></div>
    <!-- 底部输入区 -->
    <footer id="composer">
      <div id="thinking" class="thinking hidden"><span class="dot"></span><span class="thinking-text">思考中…</span><button id="stop-btn" class="btn-stop">停止</button></div>
      <div id="input-row">
        <textarea id="message-input" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
        <button id="send-btn" class="btn-send">发送</button>
      </div>
    </footer>
  </main>
</div>

<!-- 工具审批模态框 -->
<div id="approval-modal" class="modal hidden">
  <div class="modal-mask"></div>
  <div class="modal-card">
    <h3>🔐 等待工具审批</h3>
    <div class="modal-row">工具 <code id="apv-tool-name"></code><span id="apv-reason" class="apv-reason hidden"></span></div>
    <div class="modal-row label-dim">参数</div>
    <table id="apv-args-table" class="args-table">
      <thead><tr><th style="width:30%">键</th><th>值</th></tr></thead>
      <tbody></tbody>
    </table>
    <div id="apv-args-raw" class="apv-raw hidden"></div>
    <label class="reject-reason">拒绝原因（可选）<input id="apv-reason-input" type="text" placeholder="填写后作为 reason 传给后端"></label>
    <div class="modal-actions">
      <button id="apv-reject-btn" class="btn-reject">拒绝</button>
      <button id="apv-approve-btn" class="btn-approve">批准</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
