<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="../../components.css">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
<style>
html{background:var(--background)}
body{margin:0;font-family:var(--font-body);font-size:var(--font-size-body);color:var(--foreground);line-height:var(--line-height-body)}
.uikit-wallpaper{position:fixed;inset:0;z-index:-1;background:linear-gradient(165deg,var(--liquid-blue-100),var(--liquid-violet-100))}
.uikit-shell{box-sizing:border-box;width:100%;max-width:1184px;margin:0 auto;overflow:hidden;display:grid;grid-template-columns:var(--uikit-sidebar-w,220px) minmax(0,1fr);gap:var(--space-4);padding:var(--space-4)}
.uikit-sidebar,.uikit-main,.uikit-toolbar{min-width:0}
.uikit-sidebar{overflow:hidden;max-width:100%}
[data-component]{min-width:0;max-width:100%;overflow:hidden}
.uikit-main{position:relative;display:flex;flex-direction:column;gap:var(--space-4)}
.uikit-toolbar{display:flex;align-items:center;gap:var(--space-2)}
.uikit-toolbar>.toolbar{width:100%}
.uikit-view{display:flex;flex-direction:column;gap:var(--space-4);min-width:0;animation:uikit-fade .24s ease}
@keyframes uikit-fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.uikit-responsive-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-4)}
.uikit-truncate{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uikit-nowrap{white-space:nowrap;flex-shrink:0}
.uikit-num{font-variant-numeric:tabular-nums}
.uikit-action-cell{display:flex;align-items:center;gap:8px;min-width:0;max-width:160px;overflow:hidden}
.uikit-action{min-width:0;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uikit-sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.uikit-kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.uikit-kpi{display:flex;flex-direction:column;gap:var(--space-1);min-width:0;border-left:1px solid var(--border-hairline);padding-left:var(--space-5)}
.uikit-kpi:first-child{border-left:none;padding-left:0}
.uikit-kpi-label{font-size:var(--font-size-caption);color:var(--muted-foreground);white-space:nowrap}
.uikit-kpi-value{font-size:var(--font-size-h2);font-weight:var(--font-weight-h2);color:var(--foreground);white-space:nowrap}
.uikit-kpi-delta{font-size:var(--font-size-caption);color:var(--muted-foreground);white-space:nowrap}
.uikit-card-head{display:flex;align-items:baseline;gap:var(--space-3);min-width:0}
.uikit-note{margin-left:auto;font-family:var(--font-mono);font-size:var(--font-size-caption);color:var(--muted-foreground);white-space:nowrap}
.uikit-chart-wrap{display:flex;gap:var(--space-3);align-items:stretch}
.uikit-scale{display:flex;flex-direction:column;justify-content:space-between;font-family:var(--font-mono);font-size:var(--font-size-caption);color:var(--muted-foreground);padding:2px 0;text-align:right}
.uikit-chart{flex:1;min-width:0;display:flex;align-items:flex-end;gap:6px;height:168px}
.chart-bar{flex:1;min-width:0;border-radius:var(--radius-sm) var(--radius-sm) 0 0;background:var(--color-primary)}
.chart-bar:hover{filter:brightness(1.1)}
.barH40{height:40%}.barH50{height:50%}.barH60{height:60%}.barH70{height:70%}.barH75{height:75%}.barH80{height:80%}.barH85{height:85%}.barH90{height:90%}.barH100{height:100%}
.uikit-chart-labels{display:flex;gap:6px;margin-top:var(--space-2)}
.uikit-chart-labels span{flex:1;min-width:0;text-align:center;font-family:var(--font-mono);font-size:var(--font-size-caption);color:var(--muted-foreground);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uikit-project-row{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) 0;border-top:1px solid var(--border-hairline);min-width:0}
.uikit-project-row:first-of-type{border-top:none}
.uikit-project-row:hover{background:var(--surface-hover)}
.uikit-project-name{flex:1;min-width:0}
.uikit-minibar{flex:0 0 110px;height:6px;border-radius:var(--radius-full);background:var(--surface-muted);overflow:hidden}
.uikit-fill{display:block;height:100%;border-radius:var(--radius-full);background:var(--color-primary)}
.progress25{width:25%}.progress40{width:40%}.progress45{width:45%}.progress55{width:55%}.progress60{width:60%}.progress65{width:65%}.progress70{width:70%}.progress75{width:75%}.progress80{width:80%}.progress85{width:85%}.progress90{width:90%}.progress100{width:100%}
.uikit-feed-row{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) 0;border-top:1px solid var(--border-hairline);min-width:0}
.uikit-feed-row:first-of-type{border-top:none}
.uikit-feed-row:hover{background:var(--surface-hover)}
.uikit-feed-text{flex:1;min-width:0}
.uikit-feed-time{color:var(--muted-foreground);font-size:var(--font-size-caption)}
.st-done{color:var(--color-success)}.st-doing{color:var(--color-primary)}.st-todo{color:var(--muted-foreground)}
.uikit-milestone{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) 0;min-width:0}
.uikit-milestone-name{flex:0 0 150px}
.uikit-track{flex:1;min-width:0;height:8px;border-radius:var(--radius-full);background:var(--surface-muted);overflow:hidden}
.uikit-milestone-pct{flex:0 0 auto;font-family:var(--font-mono);font-size:var(--font-size-caption);color:var(--muted-foreground)}
.uikit-donut-col{display:flex;gap:var(--space-5);align-items:center;min-width:0}
.uikit-donut{width:104px;height:104px;border-radius:50%;background:conic-gradient(var(--color-primary) 0 76%,var(--surface-muted) 76% 100%);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.uikit-donut-core{width:76px;height:76px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center}
.uikit-donut-core b{font-size:var(--font-size-h3);font-weight:var(--font-weight-h3);color:var(--foreground)}
.uikit-donut-core span{font-size:var(--font-size-caption);color:var(--muted-foreground)}
.uikit-table-wrap{max-width:100%;overflow-x:auto;overscroll-behavior-x:contain}
.uikit-table{width:100%;border-collapse:collapse;min-width:560px}
.uikit-table th{padding:var(--space-2) var(--space-3);text-align:left;font-size:var(--font-size-caption);font-weight:var(--font-weight-h4);color:var(--muted-foreground);white-space:nowrap;border-bottom:1px solid var(--border-hairline)}
.uikit-table td{padding:var(--space-3);font-size:var(--font-size-body);border-bottom:1px solid var(--border-hairline);min-width:0;vertical-align:middle}
.uikit-table tbody tr:last-child td{border-bottom:none}
.uikit-td-name{max-width:280px}
.uikit-input-group{display:flex;flex-direction:column;gap:var(--space-1);min-width:0}
.uikit-switch-row{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) 0;border-top:1px solid var(--border-hairline);min-width:0}
.uikit-switch-row:first-of-type{border-top:none}
.uikit-switch-row span{flex:1;min-width:0}
.uikit-modal-layer{position:absolute;inset:0;z-index:30}
.uikit-backdrop{position:absolute;inset:0;background:var(--overlay-dimmer)}
@media (max-width:900px){.uikit-shell{grid-template-columns:minmax(0,1fr)}.uikit-responsive-grid{grid-template-columns:minmax(0,1fr)}.uikit-kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.uikit-kpi{border-left:none;padding-left:0;padding-top:var(--space-3)}}
@media (max-width:640px){.uikit-toolbar{flex-direction:column;align-items:stretch}.uikit-responsive-grid{grid-template-columns:minmax(0,1fr)}.uikit-milestone-name{flex-basis:110px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
<title>iOS27透明液态玻璃 · UI Kit</title>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect} = React;

const NAV = [
  {id:'home',label:'首页',icon:'home',view:'overview'},
  {id:'recent',label:'最近',icon:'clock-3',view:'detail'},
  {id:'fav',label:'收藏',icon:'star',view:'detail'},
  {id:'settings',label:'设置',icon:'settings',view:'settings'}
];
const WEEKS = ['W1','W2','W3','W4','W5','W6','W7','W8','W9','W10','W11','W12'];
const BARS = ['barH40','barH50','barH60','barH50','barH70','barH80','barH60','barH75','barH85','barH90','barH80','barH100'];
const KPIS = [
  {label:'进行中项目',value:'12',delta:'较上周 +2'},
  {label:'本周任务',value:'48',delta:'已完成 39'},
  {label:'协作成员',value:'26',delta:'在线 18'},
  {label:'完成率',value:'87%',delta:'+4.2%'}
];
const PROJECTS = [
  {name:'液态玻璃 2.0',status:'进行中',pct:85,c:'progress85',st:'st-doing'},
  {name:'组件库迁移',status:'进行中',pct:60,c:'progress60',st:'st-doing'},
  {name:'官网改版',status:'已完成',pct:100,c:'progress100',st:'st-done'},
  {name:'无障碍改造',status:'待开始',pct:25,c:'progress25',st:'st-todo'},
  {name:'性能优化',status:'进行中',pct:45,c:'progress45',st:'st-doing'},
  {name:'设计规范文档',status:'已完成',pct:100,c:'progress100',st:'st-done'}
];
const FEED = [
  {t:'林晓 更新了「液态玻璃 2.0」',time:'10 分钟前'},
  {t:'陈默 上传了 12 个组件预览',time:'32 分钟前'},
  {t:'王岚 新建了任务「无障碍审计」',time:'1 小时前'},
  {t:'李想 完成了「色彩 token 重构」',time:'2 小时前'},
  {t:'周野 评论了「阴影体系校准」',time:'3 小时前'},
  {t:'苏禾 收藏了「官网改版」',time:'5 小时前'}
];
const MILESTONES = [
  {n:'设计 token 定稿',pct:100,c:'progress100'},
  {n:'玻璃材质规范',pct:100,c:'progress100'},
  {n:'组件基线',pct:90,c:'progress90'},
  {n:'按钮体系',pct:90,c:'progress90'},
  {n:'输入体系',pct:85,c:'progress85'},
  {n:'导航重构',pct:75,c:'progress75'},
  {n:'卡片体系',pct:80,c:'progress80'},
  {n:'模态与弹窗',pct:70,c:'progress70'},
  {n:'开关控件',pct:65,c:'progress65'},
  {n:'文档与示例',pct:55,c:'progress55'},
  {n:'无障碍审计',pct:40,c:'progress40'},
  {n:'视觉回归',pct:25,c:'progress25'}
];
const TASKS = [
  {n:'玻璃材质规范',o:'林晓',st:'已完成',pct:100,stc:'st-done'},
  {n:'组件库迁移方案',o:'陈默',st:'进行中',pct:60,stc:'st-doing'},
  {n:'无障碍审计',o:'王岚',st:'待开始',pct:25,stc:'st-todo'},
  {n:'色彩 token 重构',o:'李想',st:'已完成',pct:100,stc:'st-done'},
  {n:'阴影体系校准',o:'周野',st:'进行中',pct:75,stc:'st-doing'},
  {n:'动效规范文档',o:'苏禾',st:'待开始',pct:40,stc:'st-todo'}
];
const SWITCHES = [
  {label:'通知提醒',idx:0},
  {label:'自动同步',idx:1},
  {label:'桌面通知',idx:2,disabled:true},
  {label:'每日摘要',idx:3}
];

function App(){
  const [view,setView] = useState('overview');
  const [nav,setNav] = useState('home');
  const [newOpen,setNewOpen] = useState(false);
  const [delOpen,setDelOpen] = useState(false);
  const [fav,setFav] = useState(false);
  const [sw,setSw] = useState([true,false,false,true]);
  useEffect(()=>{ if(window.lucide) window.lucide.createIcons(); });
  const go = (id)=>{ setNav(id); setView(id==='home'?'overview':(id==='settings'?'settings':'detail')); };
  const back = ()=> { setNav('home'); setView('overview'); };
  const toggle = (idx)=>{ if(idx===2) return; setSw(prev=>prev.map((v,i)=>i===idx?!v:v)); };

  return (
    <React.Fragment>
      <div className="uikit-wallpaper"></div>
      <div className="uikit-shell" data-layout-guard="uikit-v1" style={{'--uikit-sidebar-w':'240px'}}>
        <aside className="uikit-sidebar">
          <nav className="nav-rail" data-component="navigation" aria-label="主导航">
            <div className="nav-brand"><i data-lucide="droplet" style={{width:20,height:20,display:'inline-block',color:'var(--color-primary)'}}></i><span className="uikit-truncate">iOS27透明液态玻璃</span></div>
            <div className="nav-search"><i data-lucide="search" style={{width:16,height:16,display:'inline-block'}}></i><input placeholder="搜索项目、文件" aria-label="搜索" /></div>
            <div className="nav-list">
              {NAV.map(n=>(
                <a key={n.id} href="#" className={'nav-item'+(nav===n.id?' selected':'')} onClick={e=>{e.preventDefault();go(n.id);}}>
                  <i data-lucide={n.icon} style={{width:20,height:20,display:'inline-block'}}></i><span className="uikit-truncate">{n.label}</span>
                </a>
              ))}
            </div>
            <div className="nav-foot">
              <div className="avatar"><i data-lucide="user" style={{width:20,height:20,display:'inline-block'}}></i></div>
              <span className="uikit-truncate" style={{marginLeft:'var(--space-2)'}}>产品工作室</span>
            </div>
          </nav>
        </aside>

        <main className="uikit-main">
          {view==='overview' && (
            <div className="uikit-view" key="ov">
              <h1 className="uikit-sr-only">概览</h1>
              <div className="uikit-toolbar">
                <div className="toolbar" data-component="navigation">
                  <span className="toolbar-title uikit-truncate">概览</span>
                  <span className="toolbar-spacer"></span>
                  <button className="icon-btn" aria-label="通知"><i data-lucide="bell" style={{width:20,height:20,display:'inline-block'}}></i></button>
                  {!newOpen && <button className="btn btn-primary" data-component="button" onClick={()=>setNewOpen(true)}>新建</button>}
                </div>
              </div>

              <div className="glass-card" data-component="card">
                <div className="uikit-kpi-grid">
                  {KPIS.map((k,i)=>(
                    <div key={i} className="uikit-kpi">
                      <span className="uikit-kpi-label">{k.label}</span>
                      <span className="uikit-kpi-value uikit-num">{k.value}</span>
                      <span className="uikit-kpi-delta uikit-num">{k.delta}</span>
                    </div>
                  ))}
                </div>
              </div>

              <div className="glass-card" data-component="card">
                <div className="uikit-card-head">
                  <h2 className="card-title">任务完成趋势</h2>
                  <p className="card-summary">近 12 周任务完成情况</p>
                  <span className="uikit-note">单位：项</span>
                </div>
                <div className="uikit-chart-wrap">
                  <div className="uikit-scale"><span>100</span><span>50</span><span>0</span></div>
                  <div className="uikit-chart">
                    {BARS.map((b,i)=>(<div key={i} className={'chart-bar '+b} title={'W'+(i+1)}></div>))}
                  </div>
                </div>
                <div className="uikit-chart-labels">{WEEKS.map(w=>(<span key={w}>{w}</span>))}</div>
              </div>

              <div className="uikit-responsive-grid">
                <div className="glass-card" data-component="card">
                  <div className="uikit-card-head">
                    <h2 className="card-title">最近项目</h2>
                    <p className="card-summary">最近项目与协作动态概览</p>
                  </div>
                  {PROJECTS.map((p,i)=>(
                    <div key={i} className="uikit-project-row">
                      <span className="uikit-project-name uikit-truncate">{p.name}</span>
                      <span className="uikit-minibar"><span className={'uikit-fill '+p.c}></span></span>
                      <span className={'uikit-nowrap '+p.st}>{p.status}</span>
                    </div>
                  ))}
                </div>
                <div className="glass-card" data-component="card">
                  <div className="uikit-card-head">
                    <h2 className="card-title">协作动态</h2>
                    <p className="card-summary">成员动态与任务进展</p>
                  </div>
                  {FEED.map((f,i)=>(
                    <div key={i} className="uikit-feed-row">
                      <span className="uikit-feed-text uikit-truncate">{f.t}</span>
                      <span className="uikit-feed-time uikit-nowrap">{f.time}</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {view==='detail' && (
            <div className="uikit-view" key="dt">
              <h1 className="uikit-sr-only">项目详情</h1>
              <div className="uikit-toolbar">
                <div className="toolbar" data-component="navigation">
                  <button className="btn btn-ghost" data-component="button" onClick={back}>返回</button>
                  <span className="toolbar-title uikit-truncate">液态玻璃 2.0</span>
                  <span className="toolbar-spacer"></span>
                  <button className="btn btn-secondary" data-component="button" onClick={()=>setFav(!fav)}>{fav?'已收藏':'收藏'}</button>
                  <button className="btn btn-primary" data-component="button">新建任务</button>
                </div>
              </div>

              <div className="glass-card clear" data-component="card">
                <div className="card-media"></div>
                <div className="card-dimmer"></div>
                <span className="card-caption">液态玻璃 2.0 · 设计系统重构 · 完成度 76%</span>
              </div>

              <div className="uikit-responsive-grid">
                <div className="glass-card" data-component="card">
                  <div className="uikit-card-head"><h2 className="card-title">完成度</h2><p className="card-summary">里程碑平均完成比例</p></div>
                  <div className="uikit-donut-col">
                    <div className="uikit-donut" role="img" aria-label="完成度 76%">
                      <div className="uikit-donut-core"><b className="uikit-num">76%</b><span>已完成</span></div>
                    </div>
                    <div style={{display:'flex',flexDirection:'column',gap:'var(--space-2)',minWidth:0}}>
                      <span className="uikit-truncate">剩余里程碑 3 项</span>
                      <span className="uikit-truncate">逾期任务 1 项</span>
                      <span className="uikit-truncate">协作成员 8 人</span>
                    </div>
                  </div>
                </div>
                <div className="glass-card" data-component="card">
                  <div className="uikit-card-head"><h2 className="card-title">里程碑进度</h2><p className="card-summary">12 个里程碑当前状态</p></div>
                  {MILESTONES.map((m,i)=>(
                    <div key={i} className="uikit-milestone">
                      <span className="uikit-milestone-name uikit-truncate">{m.n}</span>
                      <span className="uikit-track"><span className={'uikit-fill '+m.c}></span></span>
                      <span className="uikit-milestone-pct uikit-num">{m.pct}%</span>
                    </div>
                  ))}
                </div>
              </div>

              <div className="glass-card" data-component="card">
                <div className="uikit-card-head">
                  <h2 className="card-title">任务列表</h2>
                  <p className="card-summary">当前迭代的任务明细</p>
                  <span className="uikit-note">共 24 项</span>
                </div>
                <div className="uikit-table-wrap">
                  <table className="uikit-table">
                    <thead><tr><th>任务</th><th>负责人</th><th>状态</th><th>进度</th><th>操作</th></tr></thead>
                    <tbody>
                      {TASKS.map((t,i)=>(
                        <tr key={i}>
                          <td className="uikit-td-name"><span className="uikit-truncate">{t.n}</span></td>
                          <td className="uikit-nowrap">{t.o}</td>
                          <td className={'uikit-nowrap '+t.stc}>{t.st}</td>
                          <td className="uikit-nowrap uikit-num">{t.pct}%</td>
                          <td><div className="uikit-action-cell"><button className="btn btn-ghost btn-sm uikit-action" data-component="button">查看</button><button className="icon-btn" aria-label="编辑"><i data-lucide="edit" style={{width:16,height:16,display:'inline-block'}}></i></button></div></td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}

          {view==='settings' && (
            <div className="uikit-view" key="st">
              <h1 className="uikit-sr-only">设置</h1>
              <div className="uikit-toolbar">
                <div className="toolbar" data-component="navigation">
                  <span className="toolbar-title uikit-truncate">设置</span>
                  <span className="toolbar-spacer"></span>
                  <button className="btn btn-primary" data-component="button">完成</button>
                </div>
              </div>

              <div className="uikit-responsive-grid">
                <div className="glass-card" data-component="card">
                  <div className="uikit-card-head"><h2 className="card-title">基本信息</h2><p className="card-summary">项目的核心元信息</p></div>
                  <div style={{display:'flex',flexDirection:'column',gap:'var(--space-4)',alignItems:'flex-start'}}>
                    <div className="uikit-input-group" data-component="input">
                      <label className="field-label" htmlFor="f1">项目名称</label>
                      <div className="glass-input"><input id="f1" type="text" value="液态玻璃 2.0" readOnly /></div>
                    </div>
                    <div className="uikit-input-group" data-component="input">
                      <label className="field-label" htmlFor="f2">项目描述</label>
                      <div className="glass-input"><input id="f2" type="text" value="设计系统的材质与组件规范" readOnly /></div>
                    </div>
                    <div className="uikit-input-group" data-component="input">
                      <label className="field-label" htmlFor="f3">项目密钥</label>
                      <div className="glass-input is-error"><input id="f3" type="text" defaultValue="LG-27" /></div>
                      <span className="input-hint">名称不能为空</span>
                    </div>
                    <div className="uikit-input-group" data-component="input">
                      <label className="field-label" htmlFor="f4">内部代号</label>
                      <div className="glass-input"><input id="f4" type="text" value="LG-27" disabled readOnly /></div>
                    </div>
                  </div>
                </div>
                <div className="glass-card" data-component="card">
                  <div className="uikit-card-head"><h2 className="card-title">偏好设置</h2><p className="card-summary">通知与同步行为</p></div>
                  {SWITCHES.map(s=>(
                    <div key={s.idx} className="uikit-switch-row" data-component="switch">
                      <button type="button" role="switch" aria-checked={sw[s.idx]} aria-label={s.label}
                        className={'sw'+(sw[s.idx]?' on':'')+(s.disabled?' disabled':'')}
                        onClick={()=>toggle(s.idx)}></button>
                      <span className="uikit-truncate">{s.label}</span>
                    </div>
                  ))}
                </div>
              </div>

              <div className="glass-card" data-component="card">
                <div className="uikit-card-head">
                  <h2 className="card-title">危险区域</h2>
                  <p className="card-summary">删除项目将移除项目内的全部数据</p>
                </div>
                <button className="btn btn-destructive" data-component="button" onClick={()=>setDelOpen(true)}>删除项目</button>
              </div>
            </div>
          )}

          {newOpen && (
            <div className="uikit-modal-layer" data-component="modal">
              <div className="uikit-backdrop"></div>
              <div className="modal-sheet" role="dialog" aria-modal="true" aria-label="新建项目">
                <div className="modal-header"><h4>新建项目</h4></div>
                <div className="modal-body">
                  <input className="field" placeholder="项目名称" aria-label="项目名称" />
                  <input className="field" placeholder="项目描述（可选）" aria-label="项目描述" />
                </div>
                <div className="modal-actions">
                  <button className="btn btn-ghost" data-component="button" onClick={()=>setNewOpen(false)}>取消</button>
                  <button className="btn btn-primary" data-component="button" onClick={()=>setNewOpen(false)}>创建</button>
                </div>
              </div>
            </div>
          )}

          {delOpen && (
            <div className="uikit-modal-layer" data-component="modal">
              <div className="uikit-backdrop"></div>
              <div className="modal-alert" role="alertdialog" aria-modal="true" aria-label="删除项目">
                <div className="alert-head"><h4>删除项目？</h4></div>
                <p className="alert-msg">确定删除该项目？该操作不可撤销。</p>
                <div className="alert-actions">
                  <button className="btn btn-ghost" data-component="button" onClick={()=>setDelOpen(false)}>取消</button>
                  <button className="btn btn-destructive" data-component="button" onClick={()=>setDelOpen(false)}>删除</button>
                </div>
              </div>
            </div>
          )}
        </main>
      </div>
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script>if(window.lucide)lucide.createIcons();</script>
</body>
</html>
