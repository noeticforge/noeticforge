<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
/* Page scaffold — NOT extracted */
body { margin: 0; padding: var(--space-3); background: var(--color-background); font-family: var(--font-family-base); color: var(--color-foreground); }
.row { display: flex; gap: var(--space-4); align-items: center; margin-bottom: var(--space-2); flex-wrap: wrap; }
.label { width: 92px; flex-shrink: 0; font-size: var(--font-size-caption); color: var(--color-muted-foreground); white-space: nowrap; }
.divider { border: none; border-top: 1px solid var(--color-border); margin: var(--space-3) 0; }

/* @component-css-start */
.field { display: flex; flex-direction: column; gap: var(--space-1); flex-shrink: 0; }
.field-label { font-size: var(--font-size-caption); color: var(--color-muted-foreground); white-space: nowrap; }
.glass-input { display: flex; align-items: center; width: 220px; height: var(--size-button-md); padding: 0 var(--space-3); background: var(--color-surface-glass); border: 1px solid var(--color-border); border-radius: var(--radius-md); transition: border-color .15s, background .15s; }
.glass-input input { flex: 1; min-width: 0; background: none; border: none; outline: none; font-family: inherit; font-size: var(--font-size-body); color: var(--color-foreground); }
.glass-input input::placeholder { color: var(--color-muted-foreground); opacity: 1; }
.glass-input:focus-within { border-color: var(--color-primary); box-shadow: 0 0 0 3px var(--ring); }
.glass-input.is-error { border-color: var(--color-error); }
.glass-input.is-error:focus-within { border-color: var(--color-error); box-shadow: 0 0 0 3px var(--color-error); }
.glass-input.size-lg { height: var(--size-button-lg); }
.glass-input:has(input:disabled) { opacity: .55; }
.input-hint { font-size: var(--font-size-caption); color: var(--color-error); white-space: nowrap; }
/* @component-css-end */
</style>
</head>
<body>
<div class="row" data-evidence-sample="default">
  <span class="label">默认</span>
  <div class="field">
    <label class="field-label" for="inp-1">搜索</label>
    <div class="glass-input"><input id="inp-1" type="text" placeholder="搜索项目、文件"></div>
  </div>
</div>
<div class="row" data-evidence-sample="default">
  <span class="label">聚焦</span>
  <div class="field">
    <label class="field-label" for="inp-2">搜索</label>
    <div class="glass-input"><input id="inp-2" type="text" placeholder="搜索项目、文件" autofocus></div>
  </div>
</div>
<div class="row" data-evidence-sample="default">
  <span class="label">尺寸</span>
  <div class="field">
    <label class="field-label" for="inp-3">搜索</label>
    <div class="glass-input"><input id="inp-3" type="text" placeholder="搜索项目、文件"></div>
  </div>
  <div class="field">
    <label class="field-label" for="inp-4">搜索</label>
    <div class="glass-input size-lg"><input id="inp-4" type="text" placeholder="搜索项目、文件"></div>
  </div>
</div>
<div class="row" data-evidence-sample="default">
  <span class="label">已禁用</span>
  <div class="field">
    <label class="field-label" for="inp-5">搜索</label>
    <div class="glass-input"><input id="inp-5" type="text" placeholder="搜索项目、文件" disabled></div>
  </div>
</div>
<hr class="divider">
<div class="row" data-evidence-sample="error">
  <span class="label">错误</span>
  <div class="field">
    <label class="field-label" for="inp-6">名称</label>
    <div class="glass-input is-error"><input id="inp-6" type="text" aria-invalid="true"></div>
    <span class="input-hint">名称不能为空</span>
  </div>
</div>
</body>
</html>
