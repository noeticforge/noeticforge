<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modal 模态面板</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
/* Page scaffold — NOT extracted */
body { margin: 0; padding: 12px; background: var(--background); font-family: var(--font-body); color: var(--foreground); }
.label { display: block; font-size: var(--font-size-caption); font-weight: var(--font-weight-caption); color: var(--muted-foreground); letter-spacing: .08em; margin: 0 0 4px; }
.row { margin-bottom: 8px; }
.divider { border: 0; border-top: 1px solid var(--border); margin: 12px 0; }
.stage { position: relative; width: 100%; height: 280px; border-radius: var(--radius-lg); background: linear-gradient(135deg, var(--liquid-blue-200), var(--liquid-violet-200)); }
.stage--alert { height: 210px; background: linear-gradient(135deg, var(--liquid-teal-200), var(--liquid-blue-200)); }
.backdrop { position: absolute; inset: 0; background: var(--overlay-dimmer); border-radius: inherit; }

/* @component-css-start */
.modal-sheet { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 480px; max-width: calc(100% - var(--space-5)); box-sizing: border-box; background: var(--surface-glass); border: 1px solid var(--border-hairline); border-radius: var(--radius-xl); box-shadow: var(--shadow-4); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); color: var(--on-glass); display: flex; flex-direction: column; padding: var(--space-6); gap: var(--space-5); }
.modal-sheet::before { content: ''; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(180deg, var(--surface-glass-highlight), transparent 45%); pointer-events: none; }
.modal-sheet > div { position: relative; }
.modal-header h4 { margin: 0; font-size: var(--font-size-h4); font-weight: var(--font-weight-h4); line-height: var(--line-height-h4); color: var(--on-glass); word-break: keep-all; }
.modal-body { display: flex; flex-direction: column; gap: var(--space-3); }
.field { width: 100%; height: var(--size-input-height); box-sizing: border-box; padding: 0 var(--space-3); border: 1px solid var(--border-hairline); border-radius: var(--radius-md); background: var(--surface-glass-clear); color: var(--on-glass); font-family: var(--font-body); font-size: var(--font-size-body); min-width: 0; }
.field::placeholder { color: var(--muted-foreground); }
.field:focus { outline: none; border-color: var(--ring); }
.modal-actions { display: flex; justify-content: flex-end; align-items: center; gap: var(--space-2); }
.btn { display: inline-flex; align-items: center; justify-content: center; height: var(--size-button-md); min-width: var(--size-button-md); padding: 0 var(--space-4); border: none; border-radius: var(--radius-md); font-family: var(--font-body); font-size: var(--font-size-body); font-weight: 500; white-space: nowrap; cursor: pointer; flex-shrink: 0; transition: background .15s, border-color .15s, filter .15s; }
.btn-ghost { background: transparent; color: var(--on-glass); }
.btn-ghost:hover { background: var(--surface-hover); }
.btn-primary { background: var(--primary); color: var(--primary-foreground); }
.btn-primary:hover { filter: brightness(0.92); }
.modal-alert { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 320px; max-width: calc(100% - var(--space-5)); box-sizing: border-box; background: var(--surface-glass); border: 1px solid var(--border-hairline); border-radius: var(--radius-lg); box-shadow: var(--shadow-4); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); color: var(--on-glass); overflow: hidden; }
.modal-alert::before { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, var(--surface-glass-highlight), transparent 40%); pointer-events: none; }
.alert-head { padding: var(--space-5) var(--space-5) 0; text-align: center; position: relative; }
.alert-head h4 { margin: 0; font-size: var(--font-size-h4); font-weight: var(--font-weight-h4); color: var(--on-glass); word-break: keep-all; }
.alert-msg { margin: var(--space-2) var(--space-5) var(--space-5); text-align: center; font-size: var(--font-size-body); line-height: var(--line-height-body); color: var(--muted-foreground); position: relative; }
.alert-actions { display: flex; border-top: 1px solid var(--border-hairline); position: relative; }
.alert-actions .btn { flex: 1; min-width: 0; border-radius: 0; padding: 0; }
.alert-actions .btn + .btn { border-left: 1px solid var(--border-hairline); }
.btn-destructive { background: transparent; color: var(--error); font-weight: 600; }
.btn-destructive:hover { background: var(--surface-hover); }
/* @component-css-end */
</style>
</head>
<body>
<span class="label">玻璃面板 · 480px</span>
<div class="row">
  <div class="stage" data-evidence-sample="Glass sheet">
    <div class="backdrop"></div>
    <div class="modal-sheet">
      <div class="modal-header"><h4>新建项目</h4></div>
      <div class="modal-body">
        <input class="field" type="text" placeholder="项目名称" aria-label="项目名称">
        <input class="field" type="text" placeholder="项目描述" aria-label="项目描述">
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" type="button">取消</button>
        <button class="btn btn-primary" type="button">创建</button>
      </div>
    </div>
  </div>
</div>
<hr class="divider">
<span class="label">确认弹窗 · 320px</span>
<div class="row">
  <div class="stage stage--alert" data-evidence-sample="Alert">
    <div class="backdrop"></div>
    <div class="modal-alert">
      <div class="alert-head"><h4>删除项目？</h4></div>
      <p class="alert-msg">确定删除该项目？</p>
      <div class="alert-actions">
        <button class="btn btn-ghost" type="button">取消</button>
        <button class="btn btn-destructive" type="button">删除</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
