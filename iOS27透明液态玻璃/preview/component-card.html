<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*{margin:0;box-sizing:border-box}
.specimen{max-width:100%;margin:0 auto;border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;background:var(--surface);font-family:var(--font-body);color:var(--foreground)}
.header{display:flex;align-items:baseline;justify-content:space-between;padding:var(--space-5) var(--space-5) var(--space-4);border-bottom:1px solid var(--border)}
.header h1{font-size:var(--font-size-h4);font-weight:var(--font-weight-h4)}
.header .sub{font-size:var(--font-size-caption);color:var(--muted-foreground);margin-top:var(--space-1)}
.pill{font-size:var(--font-size-caption);color:var(--muted-foreground);border:1px solid var(--border);border-radius:var(--radius-full);padding:var(--space-1) var(--space-3);white-space:nowrap}
.stage{display:flex;flex-direction:column;gap:var(--space-3);padding:var(--space-4);background:var(--surface-muted)}
.story{display:grid;grid-template-columns:92px minmax(0,1fr);align-items:center;gap:var(--space-4);padding:var(--space-3);border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface)}
.story-label{font-size:var(--font-size-caption);color:var(--muted-foreground);text-transform:uppercase;width:92px;min-width:0;max-width:92px;flex-shrink:0;white-space:normal;overflow:hidden;overflow-wrap:anywhere;line-height:1.25}
.rail{display:flex;min-width:0;gap:var(--space-3);flex-wrap:wrap;align-items:center;padding:var(--space-2);border:1px solid var(--border);border-radius:var(--radius-md);background:var(--background)}
.rail-wallpaper{background:linear-gradient(135deg,var(--liquid-blue-100),var(--liquid-violet-100) 45%,var(--liquid-teal-100))}
.divider{border:none;border-top:1px solid var(--border);margin:var(--space-2) 0}
@media(max-width:460px){.story{grid-template-columns:1fr;gap:var(--space-2)}.story-label{width:auto;max-width:none}}
/* @component-css-start */
.glass-card{position:relative;width:100%;min-width:0;overflow:hidden;border:1px solid var(--border-hairline);padding:var(--space-6);background:var(--surface-glass);border-radius:var(--radius-lg);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);box-shadow:inset 0 1px 0 var(--surface-glass-highlight),var(--shadow-2);transition:box-shadow .15s}
.glass-card:not(.clear):hover{box-shadow:inset 0 1px 0 var(--surface-glass-highlight),var(--shadow-3)}
.glass-card:not(.clear):active{box-shadow:inset 0 1px 0 var(--surface-glass-highlight),var(--shadow-1)}
.glass-card.clear{display:flex;align-items:flex-end;padding:0;background:var(--surface-glass-clear);border-radius:var(--radius-xl);box-shadow:inset 0 1px 0 var(--surface-glass-highlight),var(--shadow-3);height:160px}
.glass-card.compact{padding:var(--space-4)}
.card-title{font-size:var(--font-size-h4);font-weight:var(--font-weight-h4);margin-bottom:var(--space-2)}
.card-summary{font-size:var(--font-size-body);color:var(--muted-foreground);line-height:var(--line-height-body);margin-bottom:var(--space-4)}
.card-links{display:flex;gap:var(--space-4);align-items:center}
.card-link{color:var(--link);font-size:var(--font-size-body);text-decoration:none;padding:var(--space-1) var(--space-2);border-radius:var(--radius-sm);white-space:nowrap;transition:background .15s}
.card-link:hover{background:var(--surface-hover)}
.card-link:focus-visible{outline:2px solid currentColor;outline-offset:2px}
.card-media{position:absolute;inset:0;background:linear-gradient(135deg,var(--liquid-violet-500),var(--liquid-blue-400))}
.card-dimmer{position:absolute;inset:0;background:var(--overlay-dimmer)}
.card-caption{position:relative;color:var(--primary-foreground);font-size:var(--font-size-body);padding:var(--space-3) var(--space-4)}
/* @component-css-end */
</style>
</head>
<body>
<main class="specimen">
  <header class="header">
    <div>
      <h1>Card 玻璃卡片</h1>
      <div class="sub">半透明玻璃材质 · 悬浮于壁纸之上</div>
    </div>
    <span class="pill">圆角 16–28px</span>
  </header>
  <div class="stage">
    <section class="story">
      <span class="story-label">Regular</span>
      <div class="rail rail-wallpaper">
        <div class="glass-card" data-evidence-sample="regular">
          <h2 class="card-title">最近项目</h2>
          <p class="card-summary">最近项目与协作动态概览</p>
          <div class="card-links">
            <a class="card-link" href="#">详情</a>
            <a class="card-link" href="#">打开</a>
          </div>
        </div>
      </div>
    </section>
    <section class="story">
      <span class="story-label">Clear</span>
      <div class="rail rail-wallpaper">
        <div class="glass-card clear" data-evidence-sample="clear">
          <div class="card-media" aria-hidden="true"></div>
          <div class="card-dimmer" aria-hidden="true"></div>
          <p class="card-caption">收藏精选</p>
        </div>
      </div>
    </section>
    <hr class="divider">
    <section class="story">
      <span class="story-label">Compact</span>
      <div class="rail rail-wallpaper">
        <div class="glass-card compact" data-evidence-sample="regular">
          <h2 class="card-title">最近项目</h2>
          <div class="card-links">
            <a class="card-link" href="#">详情</a>
            <a class="card-link" href="#">打开</a>
          </div>
        </div>
      </div>
    </section>
    <section class="story">
      <span class="story-label">Hero</span>
      <div class="rail rail-wallpaper">
        <div class="glass-card hero" data-evidence-sample="regular">
          <h2 class="card-title">最近项目</h2>
          <p class="card-summary">最近项目与协作动态概览</p>
          <div class="card-links">
            <a class="card-link" href="#">详情</a>
            <a class="card-link" href="#">打开</a>
          </div>
        </div>
      </div>
    </section>
  </div>
</main>
</body>
</html>
