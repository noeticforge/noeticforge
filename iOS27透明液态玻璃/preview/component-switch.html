<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Switch 开关</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
/* Page scaffold — NOT extracted */
body { margin: 0; padding: 12px; background: var(--color-background); font-family: var(--font-family-base); color: var(--color-foreground); font-size: var(--font-size-body); }
.row { display: flex; gap: var(--space-4); align-items: center; margin-bottom: var(--space-2); flex-wrap: wrap; }
.label { width: 92px; flex-shrink: 0; font-size: var(--font-size-caption); color: var(--color-muted-foreground); white-space: nowrap; }
.opt { display: inline-flex; align-items: center; gap: 4px; }
.opt > span { white-space: nowrap; }
.divider { border: none; border-top: 1px solid var(--color-border); margin: var(--space-3) 0; }

/* @component-css-start */
.sw { position: relative; flex-shrink: 0; width: 51px; height: 31px; padding: 0; margin: 0; box-sizing: border-box; border: 1px solid var(--color-border); border-radius: var(--radius-full); background: var(--color-surface-glass); cursor: pointer; -webkit-appearance: none; appearance: none; transition: background .15s, border-color .15s; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: var(--radius-full); background: #ffffff; box-shadow: var(--shadow-1); transition: left .15s; }
.sw.on { background: var(--color-success); border-color: transparent; }
.sw.on::after { left: 22px; }
.sw.sm { width: 38px; height: 24px; }
.sw.sm::after { width: 20px; height: 20px; }
.sw.sm.on::after { left: 16px; }
.sw:not(.disabled):hover { filter: brightness(1.08); }
.sw.disabled { opacity: .45; pointer-events: none; }
/* @component-css-end */
</style>
</head>
<body>
<div class="row"><span class="label">开</span><span class="opt" data-evidence-sample="on"><button class="sw on" type="button" role="switch" aria-checked="true" aria-label="通知提醒"></button><span>通知提醒</span></span></div>
<div class="row"><span class="label">关</span><span class="opt" data-evidence-sample="off"><button class="sw" type="button" role="switch" aria-checked="false" aria-label="自动同步"></button><span>自动同步</span></span></div>
<div class="row"><span class="label">禁用</span><span class="opt" data-evidence-sample="on"><button class="sw on disabled" type="button" disabled aria-checked="true" aria-label="通知提醒"></button><span>通知提醒</span></span><span class="opt" data-evidence-sample="off"><button class="sw disabled" type="button" disabled aria-checked="false" aria-label="自动同步"></button><span>自动同步</span></span></div>
<hr class="divider">
<div class="row"><span class="label">小尺寸</span><span class="opt" data-evidence-sample="on"><button class="sw on sm" type="button" role="switch" aria-checked="true" aria-label="通知提醒"></button><span>通知提醒</span></span><span class="opt" data-evidence-sample="off"><button class="sw sm" type="button" role="switch" aria-checked="false" aria-label="自动同步"></button><span>自动同步</span></span><span class="opt" data-evidence-sample="off"><button class="sw sm disabled" type="button" disabled aria-checked="false" aria-label="自动同步"></button><span>自动同步</span></span></div>
</body>
</html>
