<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Navigation 导航</title>
<link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
<style>
/* Page scaffold — NOT extracted */
body { margin: 0; padding: 12px; background: var(--color-surface); font-family: var(--font-body); color: var(--color-foreground); }
.row { display: flex; align-items: center; gap: var(--space-4); margin-bottom: var(--space-3); flex-wrap: wrap; }
.label { width: 92px; flex-shrink: 0; font-size: var(--font-size-caption); color: var(--color-muted-foreground); white-space: nowrap; }
.divider { border: none; height: 1px; background: var(--color-border); margin: var(--space-4) 0; }

/* @component-css-start */
[data-lucide] { flex-shrink: 0; }
.nav-rail { width: 240px; display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-4); background: var(--surface-glass); border: 1px solid var(--border-hairline); border-radius: var(--radius-lg); box-shadow: var(--shadow-2); }
.nav-brand { display: flex; align-items: center; gap: var(--space-2); font-size: var(--font-size-body); font-weight: 600; color: var(--foreground); white-space: nowrap; }
.nav-search { display: flex; align-items: center; gap: var(--space-2); height: var(--size-input-height); padding: 0 var(--space-3); background: var(--surface-glass-clear); border: 1px solid var(--border-hairline); border-radius: var(--radius-md); color: var(--muted-foreground); }
.nav-search input { width: 100%; min-width: 0; border: none; outline: none; background: transparent; color: var(--foreground); font-family: var(--font-body); font-size: var(--font-size-caption); }
.nav-list { display: flex; flex-direction: column; gap: var(--space-1); }
.nav-item { display: flex; align-items: center; gap: var(--space-2); height: var(--size-button-md); padding: 0 var(--space-3); border-radius: var(--radius-md); color: var(--foreground); font-size: var(--font-size-body); text-decoration: none; white-space: nowrap; transition: background .15s; }
.nav-item:hover { background: var(--surface-hover); }
.nav-item.selected { background: color-mix(in srgb, var(--color-primary) 14%, transparent); color: var(--color-primary); }
.nav-foot { display: flex; align-items: center; padding-top: var(--space-3); border-top: 1px solid var(--border-hairline); }
.avatar { display: flex; align-items: center; justify-content: center; width: var(--size-button-md); height: var(--size-button-md); border-radius: var(--radius-full); background: var(--surface-glass-highlight); border: 1px solid var(--border-hairline); color: var(--muted-foreground); }
.toolbar { display: flex; align-items: center; gap: var(--space-3); flex: 1 1 auto; min-width: 0; padding: var(--space-2) var(--space-3); background: var(--surface-glass); border: 1px solid var(--border-hairline); border-radius: var(--radius-md); }
.toolbar-title { font-size: var(--font-size-body); font-weight: 600; color: var(--foreground); white-space: nowrap; }
.toolbar-spacer { flex: 1 1 auto; }
.btn-primary { display: inline-flex; align-items: center; height: var(--size-button-md); min-width: var(--size-button-md); padding: 0 var(--space-4); background: var(--color-primary); color: var(--primary-foreground); border: none; border-radius: var(--radius-md); font-family: var(--font-body); font-size: var(--font-size-body); white-space: nowrap; cursor: pointer; transition: background .15s; }
.btn-primary:hover { filter: brightness(.92); }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; width: var(--size-button-md); height: var(--size-button-md); border: none; background: transparent; border-radius: var(--radius-md); color: var(--foreground); cursor: pointer; transition: background .15s; }
.icon-btn:hover { background: var(--surface-hover); }
/* @component-css-end */
</style>
</head>
<body>
<div class="row">
  <span class="label">玻璃侧边栏</span>
  <nav class="nav-rail" data-evidence-sample="sidebar" aria-label="主导航">
    <div class="nav-brand"><i data-lucide="droplet" style="width:20px;height:20px;color:var(--color-primary)"></i><span>iOS27透明液态玻璃</span></div>
    <div class="nav-search"><i data-lucide="search" style="width:16px;height:16px"></i><input type="text" placeholder="搜索" aria-label="搜索"></div>
    <div class="nav-list">
      <a href="#" class="nav-item selected" aria-current="page"><i data-lucide="home" style="width:20px;height:20px"></i><span>首页</span></a>
      <a href="#" class="nav-item"><i data-lucide="clock" style="width:20px;height:20px"></i><span>最近</span></a>
      <a href="#" class="nav-item"><i data-lucide="star" style="width:20px;height:20px"></i><span>收藏</span></a>
      <a href="#" class="nav-item"><i data-lucide="settings" style="width:20px;height:20px"></i><span>设置</span></a>
    </div>
    <div class="nav-foot"><span class="avatar" aria-label="账户"><i data-lucide="user" style="width:20px;height:20px"></i></span></div>
  </nav>
</div>
<hr class="divider">
<div class="row">
  <span class="label">玻璃工具栏</span>
  <div class="toolbar" data-evidence-sample="toolbar">
    <span class="toolbar-title">概览</span>
    <span class="toolbar-spacer"></span>
    <button class="btn-primary">新建</button>
    <button class="icon-btn" aria-label="通知"><i data-lucide="bell" style="width:20px;height:20px"></i></button>
    <button class="icon-btn" aria-label="账户"><i data-lucide="user" style="width:20px;height:20px"></i></button>
  </div>
</div>
<script>lucide.createIcons();</script>
</body>
</html>
