<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<title>Button 按钮</title>
<style>
/* Page scaffold — NOT extracted */
body { margin: 0; padding: 12px; background: var(--color-background); font-family: var(--font-family-base); color: var(--color-foreground); }
.row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
.label { width: 92px; flex-shrink: 0; font-size: var(--font-size-caption); color: var(--color-muted-foreground); white-space: nowrap; }
.divider { border: none; border-top: 1px solid var(--color-border); margin: 4px 0 12px; }
/* @component-css-start */
/* Component definitions — extracted to components.css */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: none; cursor: pointer; font-family: inherit; font-size: var(--font-size-body); font-weight: var(--font-weight-body); white-space: nowrap; text-decoration: none; flex-shrink: 0; border-radius: var(--radius-md); min-width: var(--size-button-md); transition: background .15s, border-color .15s, box-shadow .15s, transform .15s; }
.btn:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--color-primary); color: #ffffff; height: var(--size-button-md); padding: 0 16px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.4); }
.btn-primary:hover { filter: brightness(1.08); box-shadow: var(--shadow-2), inset 0 1px 0 rgba(255,255,255,0.4); }
.btn-secondary { background: var(--surface-glass); border: 1px solid var(--border-hairline); color: var(--color-foreground); height: var(--size-button-md); padding: 0 16px; }
.btn-secondary:hover { background: var(--surface-glass-highlight); }
.btn-secondary:disabled { background: var(--surface-muted); border-color: var(--color-border); color: var(--color-muted-foreground); cursor: default; }
.btn-ghost { background: transparent; color: var(--color-foreground); height: var(--size-button-md); padding: 0 16px; }
.btn-ghost:hover { background: var(--surface-hover); }
.btn-destructive { background: var(--color-error); color: #ffffff; height: var(--size-button-md); padding: 0 16px; }
.btn-destructive:hover { filter: brightness(1.08); box-shadow: var(--shadow-2); }
.btn-sm { height: var(--size-button-sm); min-width: var(--size-button-sm); padding: 0 12px; }
.btn-lg { height: var(--size-button-lg); min-width: var(--size-button-lg); padding: 0 20px; }
/* @component-css-end */
</style>
</head>
<body>
<div class="row"><span class="label">主要</span><button class="btn btn-primary" data-evidence-sample="primary">新建</button></div>
<div class="row"><span class="label">次要</span><button class="btn btn-secondary" data-evidence-sample="secondary">取消</button><button class="btn btn-secondary" data-evidence-sample="secondary" disabled>取消</button></div>
<div class="row"><span class="label">危险</span><button class="btn btn-destructive" data-evidence-sample="destructive">删除</button></div>
<div class="row"><span class="label">幽灵</span><button class="btn btn-ghost">取消</button></div>
<hr class="divider">
<div class="row"><span class="label">尺寸</span><button class="btn btn-primary btn-sm" data-evidence-sample="primary">新建</button><button class="btn btn-primary" data-evidence-sample="primary">新建</button><button class="btn btn-primary btn-lg" data-evidence-sample="primary">新建</button></div>
</body>
</html>
