appId: com.agentbase.desktop
productName: agent-base
directories:
  output: release/
files:
  - dist/**
  - renderer/**
  - plugins/builtin/**
  - package.json
  - "!**/*.map"
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
asar: true
# 内置插件目录保持可读：asar 内 fs 读取可用，无需 extraResources
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-setup.${ext}
portable:
  artifactName: ${productName}-${version}-portable.${ext}
mac:
  target: dmg
  category: public.app-category.productivity
  # 未签名分发：首次打开需右键 → 打开；签名策略定夺后再启用 identity
  identity: null
linux:
  target: AppImage
  category: Utility
publish:
  provider: github
  # 私有仓库：打包生成的 app-update.yml 必须显式标记 private，
  # 运行端由 electron-updater 读取 GH_TOKEN/GITHUB_TOKEN 后走 PrivateGitHubProvider。
  # 私有仓库：发布时需 GH_TOKEN/GITHUB_TOKEN（electron-builder --publish always），
  # 运行时检查更新由 electron-updater 读取 app-update.yml（打包时自动生成）里的此配置。
  # owner/repo 已按实际仓库 noeticforge/noeticforge 修正。
  private: true
  owner: noeticforge
  repo: noeticforge
